name: Android APK

# Builds the Kizuki Android app (mobile/) and verifies it end to end on an Android
# emulator. The APK is only built after `flutter analyze` and `flutter test` pass; the
# emulator job then installs that exact APK (release smoke test) and drives the whole
# first-run flow in profile mode, saving real screenshots.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same Flutter as the local build that passed analyze/test/build.
          flutter-version: "3.47.7"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kizuki.jks"
            echo "KIZUKI_KEYSTORE=$RUNNER_TEMP/kizuki.jks" >> "$GITHUB_ENV"
            echo "Signing with the fixed Kizuki key"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: APK is signed with a throwaway debug key and will not install over earlier builds"
          fi

      - name: Build release APK
        env:
          KIZUKI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIZUKI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --split-per-abi

      - name: Check signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E "SHA-256|DN" | tee /tmp/cert.txt
          if [ -n "${KIZUKI_KEYSTORE:-}" ]; then grep -qi "998e8734cb805df541868ce39117fb9e6a97eb9c015772dc59d84591fb7eff90" /tmp/cert.txt; fi

      - name: Name the APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${ABI}-release.apk" "build/app/outputs/flutter-apk/kizuki-${VERSION}-${GITHUB_SHA::7}-${ABI}.apk"
          done
          python3 ../scripts/apk_size_report.py build/app/outputs/flutter-apk/kizuki-*.apk | tee build/app/outputs/flutter-apk/size-report.txt
          cat build/app/outputs/flutter-apk/size-report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kizuki-android-apk
          path: |
            mobile/build/app/outputs/flutter-apk/kizuki-*.apk
            mobile/build/app/outputs/flutter-apk/size-report.txt
          if-no-files-found: error
          retention-days: 30

  emulator-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install packages
        run: flutter pub get

      - uses: actions/download-artifact@v4
        with:
          name: kizuki-android-apk
          path: mobile/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/e2e-out
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: mobile
          script: APK=$(ls "$PWD"/apk/*-x86_64.apk | head -1) bash ../.github/scripts/e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kizuki-emulator-e2e
          path: e2e-out
          if-no-files-found: warn
          retention-days: 30
