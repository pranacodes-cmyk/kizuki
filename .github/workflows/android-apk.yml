name: Android APK

# Builds the Kizuki Android app (mobile/) and verifies it end to end on an Android
# emulator. The APK is only built after `flutter analyze` and `flutter test` pass; the
# emulator job then installs that exact APK (release smoke test) and drives the whole
# first-run flow in profile mode, saving real screenshots.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same Flutter as the local build that passed analyze/test/build.
          flutter-version: "3.47.7"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/kizuki-${VERSION}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kizuki-android-apk
          path: mobile/build/app/outputs/flutter-apk/kizuki-*.apk
          if-no-files-found: error
          retention-days: 30

  emulator-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install packages
        run: flutter pub get

      - uses: actions/download-artifact@v4
        with:
          name: kizuki-android-apk
          path: mobile/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/e2e-out
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: mobile
          script: APK=$(ls "$PWD"/apk/*.apk | head -1) bash ../.github/scripts/e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kizuki-emulator-e2e
          path: e2e-out
          if-no-files-found: warn
          retention-days: 30
